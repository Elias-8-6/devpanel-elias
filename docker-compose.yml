services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Recommended by the official image docs when running under compose.
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Database GUI, same image and port as the official postgres Docker Hub example.
  adminer:
    image: adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      - db

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # tsc --watch needs polling on Windows/macOS bind mounts.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      # Browser traffic arrives through exactly one proxy (Vite), which appends
      # the client IP to X-Forwarded-For. Rate limits key on that IP.
      TRUST_PROXY_HOPS: 1
    ports:
      # Loopback only: with TRUST_PROXY_HOPS=1, direct callers could spoof
      # X-Forwarded-For, so the API must not be reachable from the network.
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:

# Every port is published on 127.0.0.1 only: this is a development stack with
# credentials committed in .env.example, so nothing may be reachable from the
# local network (SECURITY.md, SEC-02).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Recommended by the official image docs when running under compose.
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Database GUI, same image and port as the official postgres Docker Hub example.
  # Opt-in (full DB access through a browser): docker compose --profile tools up -d
  adminer:
    image: adminer
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # tsc --watch needs polling on Windows/macOS bind mounts.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      # Browser traffic arrives through exactly one proxy (Vite), which appends
      # the client IP to X-Forwarded-For. Rate limits key on that IP.
      TRUST_PROXY_HOPS: 1
    ports:
      # Also required by TRUST_PROXY_HOPS=1: direct callers could otherwise
      # spoof X-Forwarded-For.
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Build output stays inside the container (owned by the non-root user)
      # instead of being written into the host's bind-mounted folder.
      - /app/dist
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3000
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
